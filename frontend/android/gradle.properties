org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter's current Gradle plugin still targets the legacy Android DSL under
# AGP 9. Removing these before Flutter migrates it makes the plugin fail at
# configuration time; keep the compatibility bridge until that upgrade.
android.newDsl=false
android.builtInKotlin=false
