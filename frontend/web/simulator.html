<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>ARUVERSE · Cihaz Simülatörü</title>
<style>
  /*
   * Lives in web/ so Flutter serves it from the same origin as the app.
   * That is the whole reason the diagnostics panel can work: same-origin
   * means this page can read the iframe's console, errors and network
   * traffic. Served from anywhere else the browser would block all of it
   * and the panel would sit empty.
   */
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #262d38;
    --ink: #e6edf3; --muted: #8b949e;
    --blue: #4c8dff; --red: #f85149; --amber: #d29922; --green: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-columns: 210px minmax(0, 1fr) 420px;
    height: 100dvh; min-height: 0; overflow: hidden;
  }
  aside, section { min-height: 0; overflow: auto; }
  aside { border-right: 1px solid var(--line); background: var(--panel); }
  .side-title {
    padding: 14px 14px 8px; font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
  }
  .device {
    padding: 9px 14px; cursor: pointer; border-left: 3px solid transparent;
    display: flex; justify-content: space-between; gap: 8px; align-items: baseline;
  }
  .device:hover { background: #1c2230; }
  .device.on { background: #1c2230; border-left-color: var(--blue); }
  .device b { font-weight: 600; }
  .device span { color: var(--muted); font-size: 11px; white-space: nowrap; }

  main {
    display: flex; flex-direction: column; gap: 10px;
    padding: 12px; overflow: hidden; min-width: 0; min-height: 0;
  }
  body.focus-mode {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr);
  }
  body.focus-mode aside, body.focus-mode section { display: none; }
  body.focus-mode main { grid-column: 1; grid-row: 1; }
  /* The stage owns the leftover height, so the frame can be centred and
     measured against a real box instead of the whole window. */
  #stage {
    flex: 1; min-height: 0; position: relative; overflow: hidden;
    border: 1px solid var(--line); border-radius: 16px;
    background:
      radial-gradient(circle at 50% 35%, rgba(76,141,255,.09), transparent 36%),
      #0b0e13;
  }

  /* Responsive: on a narrow window the side panels stop being columns and
     the phone keeps the space. Below that they stack, so the tool still
     works on a laptop screen or half a monitor. */
  @media (max-width: 1280px) {
    body { grid-template-columns: 170px 1fr 340px; }
  }
  @media (max-width: 1000px) {
    body { grid-template-columns: 150px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 260px; }
    section { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); }
  }
  @media (max-width: 700px) {
    body { grid-template-columns: minmax(0, 1fr); grid-template-rows: 52px minmax(280px, 1fr) minmax(150px, 30vh); }
    aside {
      border-right: 0; border-bottom: 1px solid var(--line);
      display: flex; overflow: hidden; align-items: stretch;
    }
    aside .side-title { display: none; }
    #devices { display: flex; overflow-x: auto; min-width: 0; scrollbar-width: none; }
    #devices::-webkit-scrollbar, .bar::-webkit-scrollbar { display: none; }
    .device { flex: none; border-left: 0; border-bottom: 3px solid transparent; white-space: nowrap; padding: 8px 12px; }
    .device.on { border-left: 0; border-bottom-color: var(--blue); }
    .device span { display: none; }
    main { padding: 8px; gap: 7px; }
    .bar { overflow-x: auto; flex: none; padding-bottom: 1px; scrollbar-width: none; }
    .bar button, .status { flex: none; }
    section { min-height: 0; }
    .head { padding: 8px 10px; }
    .filters { padding: 0 10px 7px; flex-wrap: nowrap; overflow-x: auto; }
  }
  .frame {
    background: #000; border-radius: 44px; padding: 12px;
    box-shadow: 0 0 0 2px #2b3240, 0 24px 60px rgba(0,0,0,.6);
    position: absolute; top: 50%; left: 50%; flex: none;
    transform-origin: center center;
  }
  .notch {
    position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
    width: 100px; height: 26px; background: #000; border-radius: 14px; z-index: 2;
  }
  .screen { position: relative; overflow: hidden; border-radius: 34px; background: #fff; }
  iframe {
    position: absolute; left: 0; top: var(--safe-top, 0px);
    border: 0; background: #fff; display: block;
  }
  .app-state {
    position: absolute; inset: 0; z-index: 5; display: grid; place-items: center;
    padding: 30px; text-align: center; color: #20242b; background: #f7f8fa;
    font-size: 13px;
  }
  .app-state.hidden { display: none; }
  .spinner {
    width: 28px; height: 28px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid #dce1e8; border-top-color: var(--blue);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bar { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
  button {
    background: #21262d; color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px;
  }
  button:hover { background: #2b323d; }
  button.on { border-color: var(--blue); color: var(--blue); }
  .status {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px;
    border: 1px solid var(--line); border-radius: 999px; white-space: nowrap;
  }
  .status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
  .status.ok::before { background: var(--green); box-shadow: 0 0 8px rgba(63,185,80,.6); }
  .status.bad::before { background: var(--red); }

  section { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; }
  .head {
    padding: 12px 14px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .head strong { font-size: 13px; }
  .filters { display: flex; gap: 5px; flex-wrap: wrap; padding: 0 14px 10px; }
  .chip {
    font-size: 11px; padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--line); cursor: pointer; color: var(--muted);
  }
  .chip.on { color: var(--ink); border-color: var(--blue); background: #16233a; }
  .chip i { font-style: normal; opacity: .7; }

  .log { flex: 1; overflow: auto; }
  .row { border-bottom: 1px solid var(--line); padding: 9px 14px; cursor: pointer; }
  .row:hover { background: #1b2029; }
  .row .top { display: flex; gap: 8px; align-items: baseline; }
  .tag {
    font-size: 10px; padding: 1px 6px; border-radius: 4px; flex: none;
    text-transform: uppercase; letter-spacing: .04em; font-weight: 700;
  }
  .t-moderation { background: #3d1f2b; color: #ff9db1; }
  .t-network    { background: #3a2a12; color: #ffcb6b; }
  .t-layout     { background: #2a2140; color: #c3a6ff; }
  .t-asset      { background: #12303a; color: #7fd3e8; }
  .t-runtime    { background: #3d1c1c; color: #ff9c94; }
  .t-ok         { background: #16301f; color: #7ee2a0; }
  .row .msg { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .when { color: var(--muted); font-size: 11px; flex: none; }
  .row pre {
    display: none; margin: 8px 0 0; padding: 8px; background: #0d1117;
    border: 1px solid var(--line); border-radius: 6px; white-space: pre-wrap;
    word-break: break-word; font-size: 11.5px; color: #c9d1d9; max-height: 320px; overflow: auto;
  }
  .row.open pre { display: block; }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
  .count { margin-left: auto; color: var(--muted); font-size: 11px; }
</style>
</head>
<body>

<aside>
  <div class="side-title">Cihaz</div>
  <div id="devices"></div>
</aside>

<main>
  <div class="bar">
    <button id="reload">Yenile</button>
    <button id="rotate">Döndür</button>
    <button id="focus">Odak modu</button>
    <button id="auto" class="on">Otomatik yenile: açık</button>
    <button id="audit">Responsive audit</button>
    <button id="offline">Çevrimdışı: kapalı</button>
    <span class="status" id="appStatus">Flutter bekleniyor</span>
    <span class="status" id="apiStatus">API kontrol ediliyor</span>
    <span class="status" id="wsStatus">Realtime kontrol ediliyor</span>
    <span id="dims"></span>
  </div>
  <div id="stage">
    <div class="frame" id="frame">
      <div class="notch"></div>
      <div class="screen" id="screen">
        <iframe id="app" src="/" allow="geolocation *; camera *; microphone *"></iframe>
        <div class="app-state" id="appState">
          <div><div class="spinner"></div><strong>Flutter başlatılıyor</strong><br>İlk açılış birkaç saniye sürebilir.</div>
        </div>
      </div>
    </div>
  </div>
</main>

<section>
  <div class="head">
    <strong>Sorunlar</strong>
    <span class="count" id="count">0 kayıt</span>
    <button id="clear">Temizle</button>
  </div>
  <div class="filters" id="filters"></div>
  <div class="log" id="log"><div class="empty">Henüz sorun yok.<br>Uygulamada gezin; hatalar burada anlık görünür.</div></div>
</section>

<script>
/* ---------------------------------------------------------------- devices */
/* Logical CSS viewport sizes, which is what the layout actually reacts to —
   not physical pixels, which would make every modern phone look enormous. */
const DEVICES = [
  ['iPhone 16 Pro Max', 440, 956],
  ['iPhone 16 Pro',     402, 874],
  ['iPhone 16',         393, 852],
  ['iPhone 15 Pro',     393, 852],
  ['iPhone SE (2022)',  375, 667],
  ['Pixel 9 Pro XL',    448, 992],
  ['Pixel 9',           412, 915],
  ['Pixel 8',           412, 915],
  ['Galaxy S24 Ultra',  412, 915],
  ['Galaxy S24',        360, 780],
  ['Galaxy A54',        360, 800],
  ['iPad mini',         744, 1133],
  ['iPad Pro 11"',      834, 1194],
];

let current = 2, landscape = false;
const app = document.getElementById('app');
const frame = document.getElementById('frame');
const screen = document.getElementById('screen');
let fitScale = 1;

function renderDevices() {
  document.getElementById('devices').innerHTML = DEVICES.map((d, i) =>
    `<div class="device ${i === current ? 'on' : ''}" data-i="${i}">
       <b>${d[0]}</b><span>${d[1]}×${d[2]}</span>
     </div>`).join('');
}

function applyDevice() {
  const [name, w, h] = DEVICES[current];
  const W = landscape ? h : w, H = landscape ? w : h;
  const hasIsland = !landscape && /^iPhone (15|16)/.test(name);
  const safeTop = landscape ? 0 : hasIsland ? 38 : name.includes('SE') ? 20 : 24;

  // The iframe is always the device's exact logical size, so the app lays
  // out against real numbers. Only the presentation is scaled, and only
  // when the frame would not otherwise fit — a 1:1 view is never shrunk
  // for no reason, and the scale is stated so nothing is misread as a
  // layout difference.
  app.style.width = W + 'px';
  app.style.height = (H - safeTop) + 'px';
  screen.style.width = W + 'px';
  screen.style.height = H + 'px';
  screen.style.setProperty('--safe-top', safeTop + 'px');

  const stage = document.getElementById('stage');
  const availH = Math.max(120, stage.clientHeight - 28);
  const availW = Math.max(120, stage.clientWidth - 28);
  const scale = Math.max(.12, Math.min(1, availH / (H + 24), availW / (W + 24)));
  fitScale = scale;

  frame.style.transform = `translate(-50%, -50%) scale(${scale})`;
  document.querySelector('.notch').style.display = hasIsland ? 'block' : 'none';
  document.getElementById('dims').textContent =
    `${name} · ${W}×${H} · ${scale === 1 ? '1:1' : Math.round(scale * 100) + '%'}`;
  renderDevices();
}

document.getElementById('devices').addEventListener('click', (e) => {
  const el = e.target.closest('.device');
  if (!el) return;
  current = +el.dataset.i;
  applyDevice();
});
document.getElementById('rotate').onclick = () => { landscape = !landscape; applyDevice(); };
document.getElementById('focus').onclick = function () {
  const enabled = document.body.classList.toggle('focus-mode');
  this.textContent = enabled ? 'Panelleri göster' : 'Odak modu';
  this.classList.toggle('on', enabled);
  requestAnimationFrame(applyDevice);
};
document.getElementById('reload').onclick = () => { app.src = app.src; };
window.addEventListener('resize', () => requestAnimationFrame(applyDevice));

/* ------------------------------------------------------------ diagnostics */
const KINDS = {
  moderation: 'Moderasyon',
  network:    'Ağ / API',
  layout:     'Yerleşim',
  asset:      'Varlık',
  runtime:    'Çalışma zamanı',
  ok:         'Başarılı',
};
/* 'ok' is on by default too: without it the panel shows "no records" even
   after it has connected, which reads as broken rather than quiet. */
const active = new Set(['moderation', 'network', 'layout', 'asset', 'runtime', 'ok']);
let entries = [];

function renderFilters() {
  document.getElementById('filters').innerHTML = Object.entries(KINDS).map(([k, label]) => {
    const n = entries.filter((e) => e.kind === k).length;
    return `<div class="chip ${active.has(k) ? 'on' : ''}" data-k="${k}">${label} <i>${n}</i></div>`;
  }).join('');
}
document.getElementById('filters').addEventListener('click', (e) => {
  const el = e.target.closest('.chip');
  if (!el) return;
  const k = el.dataset.k;
  active.has(k) ? active.delete(k) : active.add(k);
  render();
});

function render() {
  const shown = entries.filter((e) => active.has(e.kind));
  const log = document.getElementById('log');
  document.getElementById('count').textContent = `${entries.length} kayıt`;
  renderFilters();

  if (!shown.length) {
    log.innerHTML = '<div class="empty">Bu filtrede kayıt yok.</div>';
    return;
  }
  log.innerHTML = shown.map((e, i) =>
    `<div class="row" data-i="${i}">
       <div class="top">
         <span class="tag t-${e.kind}">${KINDS[e.kind]}</span>
         <span class="msg">${esc(e.title)}</span>
         <span class="when">${e.at}</span>
       </div>
       <pre>${esc(e.detail)}</pre>
     </div>`).join('');
  [...log.querySelectorAll('.row')].forEach((row) => {
    row.onclick = () => row.classList.toggle('open');
  });
}

function esc(s) {
  return String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

function add(kind, title, detail) {
  const cause = {
    moderation: 'İçerik güvenlik politikası veya hesap yaptırımı isteği reddetti.',
    network: 'API erişilemedi, zaman aşımına uğradı veya başarısız HTTP yanıtı verdi.',
    layout: 'Bir bileşen cihazın kullanılabilir görünüm alanını aşıyor.',
    asset: 'İstenen font, görsel veya statik dosya sunucuda bulunamadı.',
    runtime: 'Uygulama çalışma sırasında yakalanmamış bir hata üretti.',
    ok: 'Kontrol başarıyla tamamlandı.',
  }[kind] || 'Tanı kaydı oluşturuldu.';
  const effect = {
    moderation: 'Gönderi, yorum veya medya yayınlanmaz.',
    network: 'Ekran güncel veriyi okuyamaz veya yapılan işlem kalıcılaşmaz.',
    layout: 'Mobilde taşma, kırpılma ya da ulaşılamayan buton oluşabilir.',
    asset: 'İkon, yazı veya harita etiketi eksik görünebilir.',
    runtime: 'İlgili akış durabilir veya ekran kullanılamaz hâle gelebilir.',
    ok: 'Kullanıcı akışı beklenen şekilde çalışıyor.',
  }[kind] || 'Ayrıntıyı inceleyin.';
  entries.unshift({
    kind, title, detail: `Sebep: ${cause}\nEtki: ${effect}\n\n${detail}`,
    at: new Date().toLocaleTimeString('tr-TR'),
  });
  // Bounded so a repeating error cannot grow the page until it freezes.
  if (entries.length > 400) entries.length = 400;
  render();
}

document.getElementById('clear').onclick = () => { entries = []; render(); };

/* Classifies a console line or an exception. The categories are the ones
   that actually come up in this app, so a report says something more useful
   than "an error happened". */
function classify(text) {
  const t = String(text);
  if (/CONTENT_BLOCKED|ACCOUNT_SUSPENDED|ACCOUNT_BANNED|MODERATION_UNAVAILABLE|INVALID_FILE_CONTENTS|FILE_TOO_LARGE|VIDEO_TOO_LONG|IMAGE_TOO_LARGE/i.test(t))
    return 'moderation';
  if (/overflowed|RenderFlex|constraints|Incorrect use of Parent|unbounded/i.test(t))
    return 'layout';
  if (/Failed to load resource|404|could not be loaded|failed to fetch|asset/i.test(t))
    return 'asset';
  if (/EXCEPTION CAUGHT|Assertion failed|deactivated widget|DartError|Uncaught|TypeError/i.test(t))
    return 'runtime';
  return 'runtime';
}

/* ------------------------------------------------- hooks inside the iframe */
/*
 * The probe is injected as a <script> into the iframe so its code is
 * *authored in the iframe's own realm*, and reports back by postMessage.
 *
 * The obvious approach — reaching in from here and assigning
 * `iframe.contentWindow.fetch = function () {...}` — breaks the map. That
 * wrapper is a parent-realm function, so the values flowing through it are
 * parent-realm objects, and MapLibre serialises the style to its web worker
 * with a check equivalent to `obj.constructor === Object`. Across realms
 * that is false, so it threw "can't serialize object of unregistered class
 * Object" and no layer ever reached the worker: tiles rendered blank while
 * the errors piled up. Same-origin makes the reach-in *possible*; it does
 * not make the objects interchangeable.
 *
 * Injected source therefore has to be self-contained — it cannot close over
 * anything in this file.
 */
const PROBE = String.raw`
(function () {
  if (window.__simProbe) return;
  window.__simProbe = true;

  var post = function (kind, title, detail) {
    try {
      parent.postMessage({ __sim: 1, kind: kind, title: title, detail: detail }, '*');
    } catch (e) {}
  };
  var isApi = function (u) { return /\/api\/v\d/.test(String(u)); };
  var short = function (u) { return String(u).replace(/^https?:\/\/[^/]+/, ''); };

  ['error', 'warn'].forEach(function (level) {
    var original = console[level];
    console[level] = function () {
      var args = [].slice.call(arguments);
      var text = args.map(function (a) {
        if (a instanceof Error) return a.stack || a.message;
        if (a && typeof a === 'object') { try { return JSON.stringify(a); } catch (e) { return String(a); } }
        return String(a);
      }).join(' ');
      if (!/Image already exists on map|Analytics event/.test(text)) {
        post('console', text.split('\n')[0].slice(0, 160), text.slice(0, 4000));
      }
      return original.apply(this, args);
    };
  });

  window.addEventListener('error', function (e) {
    post('runtime', e.message || 'Yakalanmamis hata',
      (e.message || '') + '\n' + e.filename + ':' + e.lineno + ':' + e.colno +
      '\n\n' + ((e.error && e.error.stack) || ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason || {};
    post('runtime', String(r.message || r).slice(0, 160),
      String(r.message || r) + '\n\n' + (r.stack || ''));
  });

  // Only API traffic is inspected, and only when it fails — a tile request
  // must pass through completely untouched.
  var nativeFetch = window.fetch;
  var simOffline = false;
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    var method = ((init && init.method) || (input && input.method) || 'GET').toUpperCase();
    var t0 = performance.now();
    if (simOffline && isApi(url)) {
      var offlineError = new TypeError('Simülatör çevrimdışı modu: API isteği engellendi');
      post('neterr', method + ' ' + short(url), String(offlineError));
      return Promise.reject(offlineError);
    }
    var p = nativeFetch.apply(this, arguments);
    if (!isApi(url)) return p;
    return p.then(function (res) {
      if (!res.ok) {
        var ms = Math.round(performance.now() - t0);
        res.clone().text().then(function (body) {
          post('api', method + ' ' + short(url), JSON.stringify({
            method: method, url: short(url), status: res.status, ms: ms,
            body: body, sent: init && typeof init.body === 'string' ? init.body : null,
          }));
        }).catch(function () {});
      }
      return res;
    }, function (err) {
      post('neterr', method + ' ' + short(url), String(err));
      throw err;
    });
  };

  var open = XMLHttpRequest.prototype.open;
  var send = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (m, u) {
    this.__m = m; this.__u = u; this.__t = performance.now();
    return open.apply(this, arguments);
  };
  XMLHttpRequest.prototype.send = function () {
    var xhr = this;
    if (simOffline && isApi(xhr.__u)) {
      post('neterr', xhr.__m + ' ' + short(xhr.__u),
        'Simülatör çevrimdışı modu: XHR isteği engellendi');
      setTimeout(function () { xhr.abort(); }, 0);
      return;
    }
    if (isApi(xhr.__u)) {
      xhr.addEventListener('loadend', function () {
        if (xhr.status >= 200 && xhr.status < 400) return;
        var body = '';
        // responseText throws when responseType is arraybuffer/blob, which
        // is what Dart's HTTP client uses — so it is read defensively.
        try { body = xhr.responseText || ''; } catch (e) {}
        post('api', xhr.__m + ' ' + short(xhr.__u), JSON.stringify({
          method: xhr.__m, url: short(xhr.__u), status: xhr.status,
          ms: Math.round(performance.now() - xhr.__t), body: body, sent: null,
        }));
      });
    }
    return send.apply(this, arguments);
  };

  var selectorFor = function (el) {
    if (el.id) return '#' + el.id;
    var out = el.tagName.toLowerCase();
    if (el.classList && el.classList.length) out += '.' + [].slice.call(el.classList, 0, 2).join('.');
    return out;
  };
  var runResponsiveAudit = function () {
    var vw = document.documentElement.clientWidth;
    var vh = document.documentElement.clientHeight;
    var issues = [];
    [].slice.call(document.querySelectorAll('body *')).forEach(function (el) {
      if (issues.length >= 40) return;
      var tag = el.tagName.toLowerCase();
      // Flutter paints the app to canvas. Its flt-* DOM is an accessibility
      // mirror, not layout: it deliberately contains off-screen announcement
      // nodes and full-width children for horizontal/vertical scrollables.
      // Counting those as CSS overflow produced dozens of false positives
      // even when the rendered mobile screen was correct. Real RenderFlex and
      // constraint failures are still captured by the console error hook.
      if (tag === 'flutter-view' || tag.indexOf('flt-') === 0 ||
          (el.id && el.id.indexOf('flt-semantic-node-') === 0)) return;
      var style = getComputedStyle(el);
      if (style.display === 'none' || style.visibility === 'hidden') return;
      var r = el.getBoundingClientRect();
      if (r.width < 1 || r.height < 1) return;
      var intendedScroller = /auto|scroll/.test(style.overflowX);
      var intersectsViewport = r.bottom >= 0 && r.top <= vh;
      if (intersectsViewport &&
          (r.left < -2 || r.right > vw + 2 ||
           (!intendedScroller && el.scrollWidth > el.clientWidth + 2))) {
        issues.push(selectorFor(el) + ' · rect=' +
          [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)].join(',') +
          ' · scroll=' + el.scrollWidth + '×' + el.scrollHeight);
      }
    });
    if (issues.length) {
      post('layout', issues.length + ' responsive taşma adayı',
        'Viewport: ' + vw + '×' + vh + '\n\n' + issues.join('\n'));
    } else {
      post('ready', 'Responsive audit temiz',
        'Viewport ' + vw + '×' + vh + ': yatay taşma veya kırpılma bulunmadı.');
    }
  };

  var announceFlutter = function () {
    var root = document.querySelector('flutter-view, flt-glass-pane');
    if (!root) return false;
    post('appready', 'Flutter arayüzü hazır',
      'Cihaz görünümü DOM içine yerleşti ve çizim katmanı oluşturuldu.');
    return true;
  };
  if (!announceFlutter()) {
    var bootObserver = new MutationObserver(function () {
      if (announceFlutter()) bootObserver.disconnect();
    });
    bootObserver.observe(document.documentElement, { childList: true, subtree: true });
  }

  window.addEventListener('message', function (e) {
    var m = e.data || {};
    if (m.__simControl !== 1) return;
    if (m.action === 'audit') runResponsiveAudit();
    if (m.action === 'offline') {
      simOffline = !!m.value;
      post('ready', simOffline ? 'Çevrimdışı mod açıldı' : 'Çevrimdışı mod kapatıldı',
        simOffline ? 'API istekleri cihaz bağlantısı kesilmiş gibi reddedilecek.' : 'API trafiği yeniden serbest.');
    }
  });

  post('ready', 'Simülatör bağlandı', 'Konsol, hata ve ağ trafiği izleniyor.');
})();
`;

let injectedInto = null;
let offline = false;
let bootTimer = null;
let appReadyLogged = false;
const appState = document.getElementById('appState');

function setStatus(id, text, state = '') {
  const el = document.getElementById(id);
  el.textContent = text;
  el.classList.remove('ok', 'bad');
  if (state) el.classList.add(state);
}

function showAppState(html) {
  appState.innerHTML = html;
  appState.classList.remove('hidden');
}

function markAppReady() {
  clearTimeout(bootTimer);
  appState.classList.add('hidden');
  setStatus('appStatus', 'Flutter hazır', 'ok');
}

function detectFlutterReady() {
  try {
    const doc = app.contentWindow?.document;
    if (!doc?.querySelector('flutter-view, flt-glass-pane')) return;
    markAppReady();
    if (!appReadyLogged) {
      appReadyLogged = true;
      add('ok', 'Flutter arayüzü hazır',
        'Cihaz görünümü yüklendi; ekran artık gerçek mobil viewport ölçüleriyle çiziliyor.');
    }
  } catch {}
}

function inject() {
  const win = app.contentWindow;
  if (!win) return;
  let doc;
  try { doc = win.document; } catch { return; }        // not same-origin yet
  if (!doc || !doc.head || win === injectedInto) return;
  if (win.__simProbe) { injectedInto = win; return; }

  const s = doc.createElement('script');
  s.textContent = PROBE;
  doc.head.appendChild(s);
  injectedInto = win;
}

/* Re-injected on every load so the panel survives a rebuild reload. Polled
   quickly at first so the probe is in place before the app starts talking. */
app.addEventListener('load', () => {
  injectedInto = null;
  appReadyLogged = false;
  setStatus('appStatus', 'Flutter başlatılıyor');
  showAppState('<div><div class="spinner"></div><strong>Flutter başlatılıyor</strong><br>Uygulama çizim katmanı bekleniyor.</div>');
  clearTimeout(bootTimer);
  bootTimer = setTimeout(() => {
    if (appState.classList.contains('hidden')) return;
    setStatus('appStatus', 'Flutter açılamadı', 'bad');
    showAppState('<div><strong>Uygulama görüntülenemedi</strong><br><br>Build eksik veya başlangıç hatası var. Sağdaki Çalışma zamanı kayıtlarını açın ve ardından Yenile’ye basın.</div>');
    add('runtime', 'Flutter başlangıç zaman aşımı',
      '15 saniye içinde flutter-view oluşturulmadı. Build çıktısı, index.html ve tarayıcı konsolu kontrol edilmeli.');
  }, 15000);
  inject();
});
setInterval(() => { inject(); detectFlutterReady(); }, 150);

document.getElementById('audit').onclick = () => {
  app.contentWindow?.postMessage({ __simControl: 1, action: 'audit' }, '*');
};
document.getElementById('offline').onclick = function () {
  offline = !offline;
  this.textContent = `Çevrimdışı: ${offline ? 'açık' : 'kapalı'}`;
  this.classList.toggle('on', offline);
  app.contentWindow?.postMessage(
    { __simControl: 1, action: 'offline', value: offline }, '*');
};

const MODERATION_CODES =
  /CONTENT_BLOCKED|ACCOUNT_SUSPENDED|ACCOUNT_BANNED|MODERATION_UNAVAILABLE|INVALID_FILE_CONTENTS|FILE_TOO_LARGE|VIDEO_TOO_LONG|IMAGE_TOO_LARGE/i;

window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || m.__sim !== 1) return;

  if (m.kind === 'appready') {
    markAppReady();
    if (!appReadyLogged) {
      appReadyLogged = true;
      add('ok', m.title, m.detail);
    }
    return;
  }
  if (m.kind === 'ready')   return add('ok', m.title, m.detail);
  if (m.kind === 'console') return add(classify(m.detail), m.title, m.detail);
  if (m.kind === 'runtime') return add(classify(m.detail), m.title, m.detail);
  if (m.kind === 'layout')  return add('layout', m.title, m.detail);
  if (m.kind === 'neterr') {
    return add('network', `${m.title} — bağlantı kurulamadı`,
      `${m.detail}\n\nSunucu çalışmıyor olabilir, ya da IP/port yanlış.`);
  }
  if (m.kind === 'api') {
    let d; try { d = JSON.parse(m.detail); } catch { return; }
    let parsed = null; try { parsed = JSON.parse(d.body); } catch {}
    const err = parsed?.error;
    const code = err?.code || `HTTP ${d.status}`;

    const lines = [
      `${d.method} ${d.url}`,
      `Durum: ${d.status} · ${d.ms} ms`,
      `Kod:   ${code}`,
      '',
      err?.message || (d.body || '').slice(0, 400) || '(gövde yok)',
    ];
    // The fields the moderation envelope carries are exactly what explains
    // a rejection: which warning this was, and any ban expiry.
    if (err?.strike) lines.push('', `Uyarı: ${err.strike}/3`);
    if (err?.penalty) lines.push(`Ceza: ${err.penalty}`);
    if (err?.bannedUntil) lines.push(`Askı bitişi: ${err.bannedUntil}`);
    if (d.sent && d.sent.length < 600) lines.push('', 'Gönderilen:', d.sent);
    if (parsed?.meta?.request_id) lines.push('', `request_id: ${parsed.meta.request_id}`);

    add(MODERATION_CODES.test(code) ? 'moderation' : 'network',
      `${code} · ${d.method} ${d.url}`, lines.join('\n'));
  }
});

/* -------------------------------------------------------- service health */
const simParams = new URLSearchParams(location.search);
const serviceHost = simParams.get('apiHost') || location.hostname || '127.0.0.1';
const apiPort = Number(simParams.get('apiPort') || 4000);
const reverbPort = Number(simParams.get('reverbPort') || 8091);

async function checkApi() {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 4000);
  try {
    const response = await fetch(`http://${serviceHost}:${apiPort}/api/v1/health`, {
      cache: 'no-store', signal: controller.signal,
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    setStatus('apiStatus', `API ${apiPort} hazır`, 'ok');
  } catch (error) {
    setStatus('apiStatus', `API ${apiPort} kapalı`, 'bad');
  } finally {
    clearTimeout(timer);
  }
}

function checkRealtime() {
  let settled = false;
  let socket;
  const finish = (ok) => {
    if (settled) return;
    settled = true;
    setStatus('wsStatus', ok ? `Realtime ${reverbPort} hazır` : `Realtime ${reverbPort} kapalı`, ok ? 'ok' : 'bad');
    try { socket?.close(); } catch {}
  };
  try {
    socket = new WebSocket(`ws://${serviceHost}:${reverbPort}/app/arucad-local-key?protocol=7&client=simulator&version=1.0&flash=false`);
    socket.onmessage = () => finish(true);
    socket.onerror = () => finish(false);
    setTimeout(() => finish(false), 4000);
  } catch { finish(false); }
}

checkApi();
checkRealtime();
setInterval(checkApi, 15000);
setInterval(checkRealtime, 15000);

/* Auto-reload polls the dev server's build id. Flutter's own hot restart
   already updates the iframe, so this is the fallback for a full rebuild. */
let auto = true, lastTag = null;
document.getElementById('auto').onclick = function () {
  auto = !auto;
  this.textContent = `Otomatik yenile: ${auto ? 'açık' : 'kapalı'}`;
  this.classList.toggle('on', auto);
};
setInterval(async () => {
  if (!auto) return;
  try {
    const res = await fetch('/main.dart.js', { method: 'HEAD', cache: 'no-store' });
    const tag = res.headers.get('etag') || res.headers.get('last-modified');
    if (tag && lastTag && tag !== lastTag) {
      add('ok', 'Yeni derleme algılandı', 'Uygulama yeniden yükleniyor.');
      app.src = app.src;
    }
    lastTag = tag;
  } catch {}
}, 2000);

applyDevice();
render();
</script>
