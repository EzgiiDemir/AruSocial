# Edge rate limiting. Goes in the http{} context — on Debian/Ubuntu install
# as /etc/nginx/conf.d/aruverse-rate-limit.conf, NOT in sites-enabled.
#
# This is deliberately a second layer, not the main one. Laravel already
# throttles per authenticated user (throttle:api, :ai, :reports,
# :integration-tests in AppServiceProvider). That is the right place for
# per-account fairness, but it cannot help with traffic that never reaches
# PHP — an unauthenticated flood still costs a PHP-FPM worker per request.
# These zones bound that, keyed by IP because there is no authenticated
# identity yet at this layer.

# $binary_remote_addr, not $remote_addr: 4 bytes per IPv4 entry instead of
# ~15, so a 10 MB zone holds roughly 160k addresses.
#
# NOTE: behind Cloudflare or any upstream proxy this is the PROXY's address
# and every visitor shares one bucket. If ARUCAD fronts these hosts with a
# CDN, switch the key to $http_cf_connecting_ip (or configure real_ip_module)
# before enabling, or the whole campus gets limited as one client.

# Login form. Generous enough for a mistyped password, useless for guessing.
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;

# General API budget at the edge, well above normal app usage so it only
# catches automated traffic; Laravel's own 300/min per user is the real
# fairness control.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;

# Concurrent connections per address — cheap protection against slow-read
# clients holding workers open.
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# 429, not nginx's default 503: a client (and any monitoring) should be able
# to tell "you are going too fast" from "the service is broken".
limit_req_status 429;
limit_conn_status 429;

# Log at warn so a limit that starts firing in normal use is visible rather
# than silently degrading the product.
limit_req_log_level warn;
