# HTTP → HTTPS for all three ARUVERSE hosts.
#
# One block for the three names rather than a redirect inside each host file,
# so it is impossible to add a hostname to the TLS side and forget the
# redirect. `default_server` also means a request arriving on port 80 with an
# unknown or absent Host header lands here rather than being served by
# whichever vhost nginx happened to load first.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name app-aruverse.arucad.edu.tr
                api-aruverse.arucad.edu.tr
                admin-aruverse.arucad.edu.tr;

    # Certbot's HTTP-01 challenge must stay reachable over plain HTTP, or
    # renewal fails and every host goes down when the certificate expires.
    # This location is the one deliberate exception to the redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        # 301: permanent, so browsers stop trying HTTP. Safe to make
        # permanent here because these hostnames will not serve plain HTTP.
        return 301 https://$host$request_uri;
    }
}

# Any other hostname pointed at this IP (including a raw-IP request) gets
# nothing, rather than being served the app under an unexpected Host — which
# is also what Laravel's TrustHosts middleware expects.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 444;
}
