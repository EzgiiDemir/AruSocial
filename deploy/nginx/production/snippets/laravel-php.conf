# Laravel front controller + PHP-FPM handoff.
#
# Shared by the api and admin hosts because they are the SAME application:
# one Laravel deployment answering two hostnames. Keeping this in one file is
# what stops the two drifting into subtly different PHP settings.

index index.php;

# Phone photos. Matches services.media_uploads.max_image_bytes (12 MB) with
# headroom for multipart overhead; raising it here alone does not raise the
# application limit, which validates the real size itself.
client_max_body_size 32m;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    # HTTPS terminates at nginx; without this Laravel builds http:// URLs
    # and issues session cookies without the Secure attribute.
    fastcgi_param HTTPS on;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_read_timeout 120s;
    fastcgi_hide_header X-Powered-By;
}

# Dotfiles, including a .env that should never be under the web root anyway.
location ~* /\. {
    deny all;
}

# Nothing outside public/ is reachable, but these are the names that get
# probed constantly and there is no reason to answer.
location ~* /(composer\.(json|lock)|package\.json|artisan|\.env.*)$ {
    deny all;
}
