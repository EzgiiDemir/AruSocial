# app-aruverse.arucad.edu.tr — the student-facing Flutter web build.
#
# Static files only. This host runs no PHP and never proxies to the backend:
# the Flutter client talks to https://api-aruverse.arucad.edu.tr directly
# (its API_BASE_URL is compiled in at build time), and that request is a
# normal cross-origin call the API's CORS allow-list permits. Proxying /api
# through this host would have created a second, un-CORSed path to the same
# API and two places to keep an allow-list correct.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name app-aruverse.arucad.edu.tr;

    ssl_certificate     /etc/letsencrypt/live/app-aruverse.arucad.edu.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app-aruverse.arucad.edu.tr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Output of `flutter build web --release`, rsynced here by the deploy
    # script. See docs/DEPLOYMENT_ARUVERSE.md.
    root /var/www/aruverse-app;
    index index.html;

    include /etc/nginx/snippets/aruverse-security-headers.conf;

    # CSP for the student app.
    #
    # 'wasm-unsafe-eval' is required: Flutter web's CanvasKit renderer
    # instantiates a WebAssembly module, and without it the app renders a
    # blank page. 'unsafe-inline' covers the bootstrap script Flutter emits
    # into index.html.
    #
    # connect-src lists exactly what the client calls: our own API, the
    # Reverb websocket, the map tiles and the 360 tour host. Anything else a
    # dependency tries to reach is blocked by the browser rather than
    # discovered later in a network log.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api-aruverse.arucad.edu.tr wss://api-aruverse.arucad.edu.tr https://tiles.openfreemap.org https://360.arucad.edu.tr; frame-src https://360.arucad.edu.tr; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Flutter fingerprints its own assets, so they can be cached hard.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|webp|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html and the service worker must NOT be cached, or a deploy
    # leaves phones running the previous build against a newer API.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Single-page app: deep links resolve to the bundle, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* /\. {
        deny all;
    }
}
