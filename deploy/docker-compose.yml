services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arucad}
      POSTGRES_USER: ${POSTGRES_USER:-arucad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arucad}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arucad} -d ${POSTGRES_DB:-arucad}"]
      interval: 10s
      timeout: 5s
      retries: 8

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-arucad}
      DB_USERNAME: ${POSTGRES_USER:-arucad}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-arucad}
    volumes:
      - ../backend:/var/www/html
      - media:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ../backend:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/var/www/html/storage/app/public:ro
    depends_on:
      - app

  queue:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: php artisan queue:work --sleep=1 --tries=3
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-arucad}
      DB_USERNAME: ${POSTGRES_USER:-arucad}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-arucad}
    volumes:
      - ../backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy

  # Walking routes. Needs an OSM extract imported before the container
  # serves traffic — see deploy/osrm/README.md. Disabled until that data
  # exists so `docker compose up` does not pretend to route.
  osrm:
    profiles: ["routing"]
    image: osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm mld /data/cyprus-latest.osrm
    volumes:
      - osrmdata:/data
    ports:
      - "5000:5000"

volumes:
  pgdata:
  media:
  osrmdata:
