# Security response headers shared by all three ARUVERSE hosts.
#
# `always` on every header: without it nginx omits the header on error
# responses (4xx/5xx), which is exactly where a clickjacking or sniffing
# protection still needs to apply.
#
# Included INSIDE each server block, not at http level, so a host can add its
# own Content-Security-Policy without fighting an inherited one.

# Stops a browser from second-guessing a declared Content-Type. The API
# answers application/json; a mislabelled upload must not become script.
add_header X-Content-Type-Options "nosniff" always;

# Legacy but free. `frame-ancestors` in each host's CSP is the modern control
# and takes precedence in browsers that support it.
add_header X-Frame-Options "DENY" always;

# Referer leaks the admin URL (including any path) to third parties otherwise.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# None of the three hosts use these device APIs.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), interest-cohort=()" always;

# Cross-origin isolation for the document itself. Deliberately NOT
# Cross-Origin-Embedder-Policy: that breaks the 360 tour iframes and any
# third-party image the feed renders.
add_header Cross-Origin-Opener-Policy "same-origin" always;

# HSTS is deliberately NOT set here.
#
# Turning it on makes the browser refuse plain HTTP for this host for
# `max-age` seconds, and that decision cannot be taken back by editing nginx
# — every browser that saw the header keeps enforcing it until it expires. So
# it is only safe once a valid certificate is confirmed working on ALL THREE
# hostnames, including any subdomain that might later be added under them.
#
# Enable it (in each server block, or here) only after that check:
#
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
# Start with a short max-age (e.g. 300) for a day, confirm nothing broke,
# then raise it. Do not add `preload` unless ARUCAD intends to submit the
# domain to the browser preload list permanently.
