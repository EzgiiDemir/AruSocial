services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arucad}
      POSTGRES_USER: ${POSTGRES_USER:-arucad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arucad}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arucad} -d ${POSTGRES_DB:-arucad}"]
      interval: 10s
      timeout: 5s
      retries: 8

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-arucad}
      DB_USERNAME: ${POSTGRES_USER:-arucad}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-arucad}
    volumes:
      - ../backend:/var/www/html
      - media:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ../backend:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/var/www/html/storage/app/public:ro
    depends_on:
      - app

  queue:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: php artisan queue:work --sleep=1 --tries=3
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-arucad}
      DB_USERNAME: ${POSTGRES_USER:-arucad}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-arucad}
    volumes:
      - ../backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy

  # --- Routing (profile: routing) -----------------------------------------
  #
  # An OSRM instance serves exactly ONE profile, and it will answer
  # /route/v1/driving/ from a pedestrian graph without complaint. So the
  # campus runs two instances from the same Cyprus extract: osrm-foot for
  # walking, osrm-car for car and bus. The backend picks between them by
  # HOST (ROUTING_BASE_URL / ROUTING_DRIVING_BASE_URL), never by the
  # profile name in the URL — see App\Services\RoutingService.
  #
  # Cyprus, not Turkey: Geofabrik's europe/cyprus extract is the whole
  # island in one file, Northern Cyprus included.
  #
  # Bring the whole thing up with:
  #   docker compose --profile routing up -d
  # The two one-shot builders below download the extract and build each
  # graph before the servers start; both are no-ops once built.

  # Downloads cyprus-latest.osm.pbf into a shared, read-only-to-consumers
  # volume. Its own service because the OSRM image ships no download tool.
  osrm-data:
    profiles: ["routing"]
    image: curlimages/curl:8.11.1
    entrypoint: ["sh", "/scripts/fetch-extract.sh"]
    environment:
      OSRM_PBF_URL: ${OSRM_PBF_URL:-https://download.geofabrik.de/europe/cyprus-latest.osm.pbf}
      OSRM_PBF: ${OSRM_PBF_BASE:-cyprus-latest}.osm.pbf
    volumes:
      - osrmsrc:/src
      - ./osrm:/scripts:ro
    restart: "no"

  # Builds the pedestrian graph (foot.lua) into its OWN volume. Separate
  # volumes are not tidiness: osrm-extract writes its output next to the
  # input using the same basename, so one shared volume would have the
  # second profile overwrite the first.
  osrm-foot-data:
    profiles: ["routing"]
    # v5.25.0, not v5.27.1: the latter was pinned here but has never been
    # published to Docker Hub, so `--profile routing up` failed on
    # "manifest unknown" before anything could route. v5.25.0 is the
    # newest released tag and supports MLD. Override with OSRM_IMAGE.
    image: ${OSRM_IMAGE:-osrm/osrm-backend:v5.25.0}
    entrypoint: ["bash", "/scripts/build-graph.sh"]
    environment:
      OSRM_PROFILE: foot
      OSRM_PBF: ${OSRM_PBF_BASE:-cyprus-latest}.osm.pbf
    volumes:
      - osrmfoot:/data
      - osrmsrc:/src:ro
      - ./osrm:/scripts:ro
    restart: "no"
    depends_on:
      osrm-data:
        condition: service_completed_successfully

  # Builds the vehicle graph (car.lua) into its own volume.
  osrm-car-data:
    profiles: ["routing"]
    image: ${OSRM_IMAGE:-osrm/osrm-backend:v5.25.0}
    entrypoint: ["bash", "/scripts/build-graph.sh"]
    environment:
      OSRM_PROFILE: car
      OSRM_PBF: ${OSRM_PBF_BASE:-cyprus-latest}.osm.pbf
    volumes:
      - osrmcar:/data
      - osrmsrc:/src:ro
      - ./osrm:/scripts:ro
    restart: "no"
    depends_on:
      osrm-data:
        condition: service_completed_successfully

  # Walking routes — ROUTING_BASE_URL=http://osrm-foot:5000
  osrm-foot:
    profiles: ["routing"]
    image: ${OSRM_IMAGE:-osrm/osrm-backend:v5.25.0}
    command: osrm-routed --algorithm mld /data/${OSRM_PBF_BASE:-cyprus-latest}-foot.osrm
    volumes:
      - osrmfoot:/data
    ports:
      - "5000:5000"
    restart: unless-stopped
    depends_on:
      osrm-foot-data:
        condition: service_completed_successfully

  # Car and bus routes — ROUTING_DRIVING_BASE_URL=http://osrm-car:5000
  osrm-car:
    profiles: ["routing"]
    image: ${OSRM_IMAGE:-osrm/osrm-backend:v5.25.0}
    command: osrm-routed --algorithm mld /data/${OSRM_PBF_BASE:-cyprus-latest}-car.osrm
    volumes:
      - osrmcar:/data
    ports:
      - "5001:5000"
    restart: unless-stopped
    depends_on:
      osrm-car-data:
        condition: service_completed_successfully

volumes:
  pgdata:
  media:
  # The downloaded .osm.pbf, shared read-only by both builders.
  osrmsrc:
  # One graph per volume: see osrm-foot-data above for why they cannot
  # share one.
  osrmfoot:
  osrmcar:
