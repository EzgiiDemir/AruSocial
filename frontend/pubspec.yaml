name: arucad_campus_prototype
description: ARUVERSE — ARUCAD campus mobile/web client.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  # Keep framework sources, engine artifacts and native-asset hooks on the
  # same release. Older SDKs can otherwise reuse .dart_tool from a newer
  # checkout and fail with opaque dart:ui/kernel-format errors.
  flutter: '>=3.47.0 <3.48.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  # Real /admin vs / separation on web — clean URL (no #/) via usePathUrlStrategy().
  flutter_web_plugins:
    sdk: flutter
  geolocator: ^14.0.3
  # Real vector-tile map rendering (OpenStreetMap data via OpenFreeMap's
  # free, keyless tile service) — replaces the earlier hand-drawn Canvas map
  # so the app shows genuine streets/buildings instead of an illustration.
  # No Google dependency; OpenFreeMap requires no API key or account.
  maplibre_gl: ^0.26.2

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  web_socket_channel: ^3.0.2
  url_launcher: ^6.1.10
  flutter_appauth: 12.0.2
  local_auth: ^3.0.2
  flutter_local_notifications: ^22.3.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.0.4
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  file_picker: ^12.1.2
  image_picker: ^1.2.0
  # Used directly for getUserMedia camera capture on the web build.
  web: ^1.1.0
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  collection: ^1.2.1
  sentry_flutter: ^9.27.0
  crypto: ^3.0.6
  pointer_interceptor: ^0.10.1+2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/images/places/
    - assets/legal/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 900
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Regular.ttf
          weight: 400
        - asset: assets/fonts/Oswald-Medium.ttf
          weight: 500
        - asset: assets/fonts/Oswald-Bold.ttf
          weight: 700

# Flutter gen_l10n configuration (top-level)
l10n:
  arb-dir: lib/l10n
  template-arb-file: intl_en.arb
  output-localization-file: app_localizations.dart
  output-class: AppLocalizations

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
  image_path: "assets/images/aruverse_icon_light.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/aruverse_adaptive_fg.png"
  min_sdk_android: 21
