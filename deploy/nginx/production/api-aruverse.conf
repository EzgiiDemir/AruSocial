# api-aruverse.arucad.edu.tr — the single backend service.
#
# Serves the JSON API, auth, integrations and the public legal/consent pages.
# It is the SAME Laravel deployment that admin-aruverse serves; only the
# hostname and the exposed path set differ. One application, two doors, which
# is what keeps this to the minimum number of services.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name api-aruverse.arucad.edu.tr;

    ssl_certificate     /etc/letsencrypt/live/api-aruverse.arucad.edu.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-aruverse.arucad.edu.tr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/aruverse-api/public;

    include /etc/nginx/snippets/aruverse-security-headers.conf;

    # A JSON API renders nothing, so the strictest policy that still allows
    # the Blade legal pages (which ship their own small inline style).
    add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # The admin panel is NOT served on the API hostname.
    #
    # A denylist rather than a path allow-list on purpose: Filament's
    # Livewire update endpoint has an obfuscated, regenerable path
    # (/livewire-<hash>), so an allow-list would silently break the panel the
    # first time that hash changed. Blocking the panel's own prefixes here is
    # stable and is the isolation that actually matters — the login form and
    # session cookie of the admin panel are only reachable on the admin host.
    #
    # 404 rather than 403: there is no reason to confirm to a scanner that an
    # admin panel exists behind this name at all.
    location ^~ /admin { return 404; }
    location ^~ /filament { return 404; }

    # Reverb websocket.
    #
    # The Flutter client opens wss://api-aruverse.arucad.edu.tr/app/<key>
    # (chat_realtime_config.dart builds exactly that path) while Reverb
    # listens on loopback 8080. Without this location that handshake
    # reaches the Laravel front controller and 404s, which is what the
    # deployment doc recorded as the reason realtime could not work on
    # day one.
    location ^~ /app/ {
        proxy_pass http://127.0.0.1:8080;

        # HTTP/1.1 and these two headers are what make it an upgrade
        # rather than a request. Without them nginx closes the socket
        # immediately and the client retries forever.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A websocket is idle between messages by definition. The default
        # 60s read timeout would drop every quiet conversation, and the
        # client would reconnect on a loop that looks like flaky wifi.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Nothing to buffer on a stream, and buffering delays delivery.
        proxy_buffering off;
    }

    # Reverb's HTTP publish API (/apps/<id>/events) is how the server
    # broadcasts. It authenticates with REVERB_APP_SECRET and is reached
    # over loopback by the application itself — it has no business being
    # callable from the internet, where it would be an unauthenticated
    # surface protected only by a shared secret in a query string.
    location ^~ /apps/ { return 404; }

    # Uploaded media is served from here by design — the app fetches it with
    # the same base URL as the API.
    location ^~ /storage/ {
        alias /var/www/aruverse-api/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public";
        # Never execute anything that was uploaded.
        location ~ \.php$ { deny all; }
    }

    include /etc/nginx/snippets/aruverse-laravel-php.conf;
}
