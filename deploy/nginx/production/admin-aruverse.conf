# admin-aruverse.arucad.edu.tr — the Filament staff panel.
#
# Same Laravel deployment and same document root as api-aruverse; the panel
# is server-rendered Blade/Livewire inside that application, not a separate
# frontend. Giving it its own hostname means the session cookie that signs a
# person into the admin panel is scoped to a name the student app never
# touches, and it lets this host carry stricter rules than the public API.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name admin-aruverse.arucad.edu.tr;

    ssl_certificate     /etc/letsencrypt/live/admin-aruverse.arucad.edu.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin-aruverse.arucad.edu.tr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/aruverse-api/public;

    include /etc/nginx/snippets/aruverse-security-headers.conf;

    # Filament/Livewire render inline <script> and <style>, so 'unsafe-inline'
    # is required for the panel to work at all. It is still far tighter than
    # no policy: no external origin may supply script, and the panel cannot
    # be framed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # The student JSON API is not served on the admin hostname. Filament is
    # server-rendered and calls its own Livewire endpoint, never /api/v1, so
    # closing this costs nothing and keeps bearer-token traffic on one name.
    #
    # /api/v1/health stays reachable so an uptime check can target this host
    # too and prove the PHP application behind it is alive.
    location = /api/v1/health {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ^~ /api/ { return 404; }

    # OPTIONAL — office/VPN allow-list.
    #
    # Commented out because locking this to addresses ARUCAD has not
    # confirmed would lock staff out of their own panel. Uncomment and set
    # the real ranges once ARUCAD IT supplies them; this is the single
    # highest-value hardening available for an admin surface.
    #
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny all;

    # Brute-force budget for the login form. `admin_login` is defined in
    # deploy/nginx/production/rate-limit.conf (http level).
    location = /admin/login {
        limit_req zone=admin_login burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /storage/ {
        alias /var/www/aruverse-api/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public";
        location ~ \.php$ { deny all; }
    }

    include /etc/nginx/snippets/aruverse-laravel-php.conf;
}
